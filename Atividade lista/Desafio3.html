<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NutriVida - Calculadora IMC</title>
</head>
<body>

    <h1>🥗 NutriVida - Clínica de Nutrição</h1>

 
    <p>Acompanhar seu peso é fundamental para manter hábitos saudáveis e prevenir problemas de saúde.</p>

    <form action="Desafio3.php" method="POST">
        <p>
            <label>Nome da pessoa:</label><br>
            <input type="text" name="nome" required>
        </p>
        <p>
            <label>Peso (kg):</label><br>
            <input type="number" step="0.1" name="peso" placeholder="Ex: 72" required>
        </p>
        <p>
            <label>Altura (m):</label><br>
            <input type="number" step="0.01" name="altura" placeholder="Ex: 1.65" required>
        </p>
        <button type="submit">Calcular IMC</button>
    </form>

    <hr>

    <p><strong>Quer cuidar melhor da sua saúde?</strong></p>
    <p>📅 Agende uma consulta com nossa nutricionista!</p>

</body>
</html>
